name:       plc-project
version:    0.1.0.0
license:    BSD-3-Clause
author:     "Aidan Oldfield"
maintainer: "Aidan Oldfield"
copyright:  "None"

extra-source-files:
- README.md
- CHANGELOG.md

description: RDF query language for PLC coursework.

dependencies:
- base >= 4.7 && < 5
- array
- containers
- rdf4h
- text

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
  - Part2Eval
  - Parser
  - Rdf
  - Tokens
  verbatim: |
    build-tool-depends:
      alex:alex,
      happy:happy

executables:
  plc-project-exe:
    main:        Main.hs
    source-dirs: app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - plc-project

